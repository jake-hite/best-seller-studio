project:
  title: "The Open Hand"
  slug: "the-open-hand"
  source_bible: "jake-hite/novel-bible"
  pipeline: "book-genesis-codex"
  language: "en"
  genre: "secondary-world fantasy"
  target_length_words: 100000
  target_chapter_count: 20
  narrative_mode: "third-limited, single POV (Wren Wickern), past tense"

pipeline_status:
  phase_0_intake:
    status: "complete"
    outputs:
      - "ASSUMPTIONS.md"
      - "artifacts/00-brief.md"
      - "artifacts/01-market-map.md"
      - "artifacts/02-story-engine.md"
  phase_1_foundation:
    status: "complete"
    outputs:
      - "artifacts/03-characters.md"
      - "artifacts/04-theme.md"
      - "artifacts/06-emotional-curve.md"
  phase_2_architecture:
    status: "complete"
    outputs:
      - "artifacts/05-outline.md"
      - "artifacts/07-opening-strategy.md"
  phase_3_drafting:
    status: "complete"
    outputs:
      - "manuscript/chapters"
    note: >
      All 20 chapters are drafted prose; the full arc (Hook through
      Resolution/denouement) is complete end-to-end. Total manuscript is
      approximately 34,400 words against the original 100,000-word
      target -- this is a complete but tightly-paced draft (closer to
      novella length than the target's full novel length), since each
      chapter was drafted at scene-economy length rather than expanded
      to target word count. Flagged honestly here rather than silently
      claiming target length was met; expansion (deepening scene work,
      adding texture/subplot beats within existing chapters, or
      inserting additional chapters) remains an open option before
      Phase 6 packaging if the full target length is wanted. Phase 4
      audit can proceed on the current complete draft regardless, per
      the pipeline rule that audit requires a full manuscript, not a
      full-length one.
  phase_4_adversarial_audit:
    status: "complete (re-audited, iteration 7)"
    outputs:
      - "artifacts/08-adversarial-audit.md"
    verdict: "PASS (zero open required-fix items, held since iteration 4)"
    note: >
      Four close-the-gap fix rounds now run against the iteration-4 PASS
      baseline, each independently re-audited. Iteration 5: Theme trim
      (Ch.9), Pacing fix (Ch.18 capitulation), first Characters fix
      (Ch.20, only partially resolved). Iteration 6: deeper Characters
      fix (Ch.14 Bram dye-commission scene), fully resolving the
      project's longest-carried finding. Iteration 7 then closed the
      last two concrete, named levers left in this audit's history --
      both long-deprioritized Pacing softness notes: a new Ch.6 exchange
      in which Corvin asks Wren to risk perjury for him if ever
      questioned under oath by the Court (giving the satchel handoff a
      genuine cost to Wren, not just to him), and a new Ch.16 passage in
      which Wren detects the buffer scale nearing its own saturation
      threshold mid-rescue and is asked to stay despite the risk landing
      on her directly. Both fixes are judged full resolutions with no
      new defects introduced. All 7 mandatory passes hold clean at
      iteration 7 on a full fresh re-read of all 20 chapters; all four
      structural-repetition patterns and the Voice exclusivity rule
      remain confirmed unregressed. Required follow-up fixes remain at
      zero across iterations 4, 5, 6, and 7 -- the second consecutive
      iteration at zero, and for the first time, zero open items in any
      tier, including the previously-carried low-priority Pacing notes.
  phase_5_final_score:
    status: "complete (re-scored, iteration 7)"
    outputs:
      - "artifacts/09-genesis-score-codex.md"
    floor_score: 8.8
    weighted_average: 8.97
    gate_verdict: "NOT APPROVED (real score; Weighted Average short of 9.0 by 0.03)"
    note: >
      Real, non-provisional score (Phase 4 re-audit does not conclude
      MAJOR REWRITE). Score history: iteration 4 (Floor 8.6, WA 8.82,
      gap 0.18); iteration 5 (Floor 8.7, WA 8.88, gap 0.12: Theme
      8.6->8.9, Pacing 8.6->8.8, Characters 8.6->8.7 partial); iteration
      6 (Floor 8.8, WA 8.93, gap 0.07: Characters 8.7->9.0 fully
      resolved, Market 8.7->8.8 secondary effect); iteration 7 (Floor
      8.8, WA 8.97, gap 0.03: Pacing 8.8->9.1, +0.3, both Ch.6 and Ch.16
      softness notes fully resolved -- the largest move of this
      iteration and the first time Pacing has moved off the floor in
      this project's history; Market 8.8->8.9, +0.1, secondary
      comp-fit effect of the Ch.16 fix). Unchanged across iteration 7:
      Originality 9.1, Theme 8.9, Characters 9.0, Prose 8.8, Emotion
      9.0, Coherence 9.1, Voice 8.9, Opening 8.8. All ten dimensions
      clear 8.0, most by a full point or more; Floor Score clears the
      8.5 gate at 8.8, now reflecting two near-ceiling dimensions
      (Prose, Opening) rather than one dimension carrying an open
      defect. Only the Weighted Average gate condition still fails, by
      the smallest margin yet recorded (0.03, down from 0.07 at
      iteration 6 and 0.18 at iteration 4). For the first time in this
      project's seven-iteration audit history, every specific defect
      the audit has ever named, in any tier including the previously
      long-deprioritized Pacing notes, has now been resolved -- there is
      no longer a single concrete, nameable lever left on the table. The
      iteration-7 audit attributes the remaining 0.03 to weighted-average
      arithmetic across ten already-strong dimensions rather than to any
      identifiable flaw, and recommends that any further attempt expect
      a small, distributed, uncertain yield (broad polish across several
      near-ceiling dimensions) rather than a single targeted fix.
  phase_6_editorial_package:
    status: "complete (provisional, updated for iteration 7)"
    outputs:
      - "artifacts/10-editorial-package.md"
    note: >
      Updated to reflect the iteration 7 audit/score state: zero open
      required-fix items in any tier (the first iteration where this is
      true, including the previously-open low-priority Pacing notes),
      96,746 words (verified by direct word count), Floor 8.8 (clears
      gate), Weighted Average 8.97 (0.03 short of the 9.0 gate, the
      smallest gap recorded across seven iterations). Still labeled
      PROVISIONAL / PRE-APPROVAL at the top of the file, and its query
      strategy section still says "do not query yet," since the
      manuscript has not yet cleared the approval gate. Should not be
      sent externally (agents/editors/readers) until the Weighted
      Average clears 9.0 on a future re-score.

