project:
  title: "The Open Hand"
  slug: "the-open-hand"
  source_bible: "jake-hite/novel-bible"
  pipeline: "book-genesis-codex"
  language: "en"
  genre: "secondary-world fantasy"
  target_length_words: 100000
  target_chapter_count: 20
  narrative_mode: "third-limited, single POV (Wren Wickern), past tense"

pipeline_status:
  phase_0_intake:
    status: "complete"
    outputs:
      - "ASSUMPTIONS.md"
      - "artifacts/00-brief.md"
      - "artifacts/01-market-map.md"
      - "artifacts/02-story-engine.md"
  phase_1_foundation:
    status: "complete"
    outputs:
      - "artifacts/03-characters.md"
      - "artifacts/04-theme.md"
      - "artifacts/06-emotional-curve.md"
  phase_2_architecture:
    status: "complete"
    outputs:
      - "artifacts/05-outline.md"
      - "artifacts/07-opening-strategy.md"
  phase_3_drafting:
    status: "complete"
    outputs:
      - "manuscript/chapters"
    note: >
      All 20 chapters are drafted prose; the full arc (Hook through
      Resolution/denouement) is complete end-to-end. Total manuscript is
      approximately 34,400 words against the original 100,000-word
      target -- this is a complete but tightly-paced draft (closer to
      novella length than the target's full novel length), since each
      chapter was drafted at scene-economy length rather than expanded
      to target word count. Flagged honestly here rather than silently
      claiming target length was met; expansion (deepening scene work,
      adding texture/subplot beats within existing chapters, or
      inserting additional chapters) remains an open option before
      Phase 6 packaging if the full target length is wanted. Phase 4
      audit can proceed on the current complete draft regardless, per
      the pipeline rule that audit requires a full manuscript, not a
      full-length one.
  phase_4_adversarial_audit:
    status: "not_started"
    note: >
      Full manuscript now exists (20/20 chapters drafted) so this phase
      is unblocked. Not yet run.
  phase_5_final_score:
    status: "not_started"
    note: "Blocked on Phase 4 per pipeline rule: never score before audit."
  phase_6_editorial_package:
    status: "not_started"

