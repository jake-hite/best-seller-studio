project:
  title: "The Open Hand"
  slug: "the-open-hand"
  source_bible: "jake-hite/novel-bible"
  pipeline: "book-genesis-codex"
  language: "en"
  genre: "secondary-world fantasy"
  target_length_words: 100000
  target_chapter_count: 20
  narrative_mode: "third-limited, single POV (Wren Wickern), past tense"

pipeline_status:
  phase_0_intake:
    status: "complete"
    outputs:
      - "ASSUMPTIONS.md"
      - "artifacts/00-brief.md"
      - "artifacts/01-market-map.md"
      - "artifacts/02-story-engine.md"
  phase_1_foundation:
    status: "complete"
    outputs:
      - "artifacts/03-characters.md"
      - "artifacts/04-theme.md"
      - "artifacts/06-emotional-curve.md"
  phase_2_architecture:
    status: "complete"
    outputs:
      - "artifacts/05-outline.md"
      - "artifacts/07-opening-strategy.md"
  phase_3_drafting:
    status: "complete"
    outputs:
      - "manuscript/chapters"
    note: >
      All 20 chapters are drafted prose; the full arc (Hook through
      Resolution/denouement) is complete end-to-end. Total manuscript is
      approximately 34,400 words against the original 100,000-word
      target -- this is a complete but tightly-paced draft (closer to
      novella length than the target's full novel length), since each
      chapter was drafted at scene-economy length rather than expanded
      to target word count. Flagged honestly here rather than silently
      claiming target length was met; expansion (deepening scene work,
      adding texture/subplot beats within existing chapters, or
      inserting additional chapters) remains an open option before
      Phase 6 packaging if the full target length is wanted. Phase 4
      audit can proceed on the current complete draft regardless, per
      the pipeline rule that audit requires a full manuscript, not a
      full-length one.
  phase_4_adversarial_audit:
    status: "complete (re-audited, iteration 2)"
    outputs:
      - "artifacts/08-adversarial-audit.md"
    verdict: "PASS (was MAJOR REWRITE in iteration 1)"
    note: >
      Re-audit: all 7 passes re-run from scratch against the revised,
      expanded ~46,900-word manuscript (up from ~34,400 words). All
      four passes that drove iteration 1's MAJOR REWRITE escalation
      (2 Voice Differentiation, 4 Human Mess, 5 Failure Audit, 6
      Structural Repetition) now pass on direct re-reading, each with
      quoted textual evidence: Cae Rookwood now speaks in genuine child
      syntax; Wren's named jealousy of Mari is dramatized on the page
      (Ch.5); the dorky/uncool comic register is restored across 5+
      Movement III/IV beats; Ch.19's climax now contains a genuine
      mid-rescue near-miss; the Cae subplot now has a dramatized
      near-failure at the hearing (Ch.20) instead of an off-page,
      asserted resolution; two residual phrase-tic instances (Ch.2,
      Ch.9) were found via fresh full-manuscript search and fixed,
      leaving zero remaining instances. A small number of isolated,
      non-escalating findings remain (Pass 3's minor over-explanation
      notes; Bram's residual frictionlessness; a few unaddressed
      lower-priority softness notes in Ch.6/16/18; the Ch.4-6
      mentor-exit structural pattern) but none rises to "substantive
      and pervasive." Since this audit does not conclude MAJOR REWRITE,
      the Phase 5 score that follows is a real, non-provisional score.
  phase_5_final_score:
    status: "complete (re-scored, iteration 2)"
    outputs:
      - "artifacts/09-genesis-score-codex.md"
    floor_score: 7.4
    weighted_average: 8.60
    gate_verdict: "NOT APPROVED (real score, not provisional)"
    note: >
      Recorded as a real score per the gate rule, since Phase 4's
      re-audit no longer concludes MAJOR REWRITE. Weakest, and now
      only sub-8.0, dimension: Market (7.4), driven by the still-
      substantial word-count gap (~46,900 of the 100,000-word target,
      ~47%). All nine other dimensions now clear 8.0, including the
      two that drove iteration 1's escalation: Voice rose 6.5 -> 8.9,
      Characters rose 7.6 -> 8.4. Other gains: Prose 7.8 -> 8.7, Pacing
      7.5 -> 8.4, Emotion 7.9 -> 8.7, Market 6.8 -> 7.4, Originality
      8.6 -> 9.1, Theme 8.3 -> 8.5, Coherence 8.6 -> 8.9, Opening 8.7
      -> 8.8. Sole remaining required intervention before re-score:
      continue expansion toward the 100,000-word target using the same
      scene-deepening method already demonstrated (no outline or
      structural changes needed; no further audit-driven craft fix
      required).
  phase_6_editorial_package:
    status: "complete (provisional)"
    outputs:
      - "artifacts/10-editorial-package.md"
    note: >
      Produced despite non-approval so the team has a working pitch
      document to see, explicitly labeled PROVISIONAL / PRE-REVISION at
      the top of the file. The package itself names its own blocking
      issues (climax has no complication; word count is ~34,400 against
      a 100K target; voice-differentiation is unresolved) and its query
      strategy section explicitly says "do not query yet." This should
      not be sent externally (agents/editors/readers) until the Phase 5
      required interventions are actioned and the manuscript is
      re-scored above the approval gate.

