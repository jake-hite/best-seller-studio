project:
  title: "The Open Hand"
  slug: "the-open-hand"
  source_bible: "jake-hite/novel-bible"
  pipeline: "book-genesis-codex"
  language: "en"
  genre: "secondary-world fantasy"
  target_length_words: 100000
  target_chapter_count: 20
  narrative_mode: "third-limited, single POV (Wren Wickern), past tense"

pipeline_status:
  phase_0_intake:
    status: "complete"
    outputs:
      - "ASSUMPTIONS.md"
      - "artifacts/00-brief.md"
      - "artifacts/01-market-map.md"
      - "artifacts/02-story-engine.md"
  phase_1_foundation:
    status: "complete"
    outputs:
      - "artifacts/03-characters.md"
      - "artifacts/04-theme.md"
      - "artifacts/06-emotional-curve.md"
  phase_2_architecture:
    status: "complete"
    outputs:
      - "artifacts/05-outline.md"
      - "artifacts/07-opening-strategy.md"
  phase_3_drafting:
    status: "complete"
    outputs:
      - "manuscript/chapters"
    note: >
      All 20 chapters are drafted prose; the full arc (Hook through
      Resolution/denouement) is complete end-to-end. Total manuscript is
      approximately 34,400 words against the original 100,000-word
      target -- this is a complete but tightly-paced draft (closer to
      novella length than the target's full novel length), since each
      chapter was drafted at scene-economy length rather than expanded
      to target word count. Flagged honestly here rather than silently
      claiming target length was met; expansion (deepening scene work,
      adding texture/subplot beats within existing chapters, or
      inserting additional chapters) remains an open option before
      Phase 6 packaging if the full target length is wanted. Phase 4
      audit can proceed on the current complete draft regardless, per
      the pipeline rule that audit requires a full manuscript, not a
      full-length one.
  phase_4_adversarial_audit:
    status: "complete"
    outputs:
      - "artifacts/08-adversarial-audit.md"
    verdict: "MAJOR REWRITE"
    note: >
      All 7 passes run against the full 20-chapter draft. Passes 1
      (Existence), 3 (Over-Explanation), and 7 (Agent Pitch) are
      largely sound. Passes 2 (Voice Differentiation), 4 (Human Mess),
      5 (Failure Audit), and 6 (Structural Repetition) fail, escalating
      the verdict to MAJOR REWRITE per the pipeline's own multi-fail
      escalation rule. The most severe findings: every character
      (including an 11-year-old) shares one rhetorical register; the
      Ch.19 climax succeeds with no complication, inconsistent with
      the book's own established cost-for-success pattern; and the
      brief's dorky/uncool comic register disappears entirely after
      Ch.13. Explicitly does NOT require outline/structural changes --
      structure (Pass 1) passed cleanly. Five bounded interventions are
      listed in the audit (voice pass, de-duplicate repeated phrasing,
      restore comic register in >=2 late beats, add jeopardy to Ch.19
      and a real setback to the Cae subplot, expand Bram's relationship
      into a dramatized scene). Not yet actioned.
  phase_5_final_score:
    status: "complete"
    outputs:
      - "artifacts/09-genesis-score-codex.md"
    floor_score: 6.5
    weighted_average: 7.82
    gate_verdict: "NOT APPROVED (provisional)"
    note: >
      Recorded provisionally per the gate rule, since Phase 4 concluded
      MAJOR REWRITE. Weakest dimension: Voice (6.5), driven by the
      audit's voice-differentiation failure. Six of ten dimensions
      score below 8.0 (Characters 7.6, Prose 7.8, Pacing 7.5, Emotion
      7.9, Market 6.8, Voice 6.5). Strongest dimensions: Opening (8.7),
      Coherence (8.6), Originality (8.6). Required interventions before
      re-score, in priority order: voice differentiation pass; de-
      duplicate repeated chapter-ending phrasing; add real cost/jeopardy
      to Movement III and the Ch.19 climax; restore the dorky/uncool
      comic register in Movement III/IV; resolve the word-count gap
      (expansion preferred over repositioning, since required scene
      work overlaps with items above). None of these require outline
      or structural changes.
  phase_6_editorial_package:
    status: "not_started"
    note: >
      Deliberately not started. The phase's own goal statement presumes
      an approved manuscript ("turn the approved manuscript into a
      sales-ready editorial package"), and Phase 5 explicitly did not
      approve this draft. Per genesis-score-codex.md's own guidance,
      do not treat Phase 6 as a final sales-ready deliverable until a
      re-score clears the approval gate.

