project:
  title: "The Open Hand"
  slug: "the-open-hand"
  source_bible: "jake-hite/novel-bible"
  pipeline: "book-genesis-codex"
  language: "en"
  genre: "secondary-world fantasy"
  target_length_words: 100000
  target_chapter_count: 20
  narrative_mode: "third-limited, single POV (Wren Wickern), past tense"

pipeline_status:
  phase_0_intake:
    status: "complete"
    outputs:
      - "ASSUMPTIONS.md"
      - "artifacts/00-brief.md"
      - "artifacts/01-market-map.md"
      - "artifacts/02-story-engine.md"
  phase_1_foundation:
    status: "complete"
    outputs:
      - "artifacts/03-characters.md"
      - "artifacts/04-theme.md"
      - "artifacts/06-emotional-curve.md"
  phase_2_architecture:
    status: "complete"
    outputs:
      - "artifacts/05-outline.md"
      - "artifacts/07-opening-strategy.md"
  phase_3_drafting:
    status: "complete"
    outputs:
      - "manuscript/chapters"
    note: >
      All 20 chapters are drafted prose; the full arc (Hook through
      Resolution/denouement) is complete end-to-end. Total manuscript is
      approximately 34,400 words against the original 100,000-word
      target -- this is a complete but tightly-paced draft (closer to
      novella length than the target's full novel length), since each
      chapter was drafted at scene-economy length rather than expanded
      to target word count. Flagged honestly here rather than silently
      claiming target length was met; expansion (deepening scene work,
      adding texture/subplot beats within existing chapters, or
      inserting additional chapters) remains an open option before
      Phase 6 packaging if the full target length is wanted. Phase 4
      audit can proceed on the current complete draft regardless, per
      the pipeline rule that audit requires a full manuscript, not a
      full-length one.
  phase_4_adversarial_audit:
    status: "complete (re-audited, iteration 4)"
    outputs:
      - "artifacts/08-adversarial-audit.md"
    verdict: "PASS (zero open required-fix items, first time in project history)"
    note: >
      Re-audit run against the post-fix, post-full-expansion ~94,800-
      word manuscript. Iteration 3's re-audit (run immediately after
      the 4-way parallel expansion to ~94,800 words) had found a PASS
      verdict but flagged 4 new craft defects, all caused by the
      independent expansion teams converging on the same low-effort
      shortcuts: a Voice exclusivity leak (Vesper Reed's exclusive
      hedge-then-antithesis construction appearing twice in Wren's
      Ch.17 dialogue), a 5-location recurrence of the "filed [it] away"
      phrase-tic (Ch.7, 11, 12, 13, 18), a 7+-instance "smelled of X
      and, underneath that, Y" room-atmosphere template (worst in Ch.8,
      12, 17, plus a near-verbatim duplicate between Ch.11 and Ch.19),
      and a 6-instance "small unnecessary task during emotional
      overwhelm" beat (worst in Ch.10, 15, 16). All four were fixed via
      direct single-editor line edits (not further parallel delegation,
      to avoid reproducing the same convergence problem) and verified
      resolved by this iteration-4 re-audit, with no new instance of
      any of the four patterns found anywhere in the manuscript and no
      collateral damage to plot, characterization, or other scenes.
      All 7 mandatory passes hold clean. This is the first iteration to
      return zero required follow-up fixes.
  phase_5_final_score:
    status: "complete (re-scored, iteration 4)"
    outputs:
      - "artifacts/09-genesis-score-codex.md"
    floor_score: 8.6
    weighted_average: 8.82
    gate_verdict: "NOT APPROVED (real score; Weighted Average short of 9.0 by 0.18)"
    note: >
      Real, non-provisional score (Phase 4 re-audit does not conclude
      MAJOR REWRITE). Floor Score (8.6, Theme and Pacing tied) clears
      the 8.5 gate threshold for the first time across all four
      iterations, up from 8.1 (Prose) in iteration 3. Weighted Average
      rose to 8.82 from 8.64 but remains short of the required 9.0.
      Dimension changes vs. iteration 3, all directly attributable to
      the confirmed fix pass: Prose 8.1 -> 8.8, Voice 8.3 -> 8.9,
      Emotion 8.8 -> 9.0, Coherence 9.0 -> 9.1, Market 8.5 -> 8.7.
      Unchanged (untouched by the fix pass, never the subject of an
      audited defect): Originality 9.1, Theme 8.6, Characters 8.6,
      Pacing 8.6, Opening 8.8. All ten dimensions clear 8.0. No single
      dimension is in crisis; the remaining 0.18 gap to approval is
      now a matter of incremental strengthening of mid-tier dimensions
      (Theme, Characters, Pacing) rather than defect repair. Concrete,
      already-diagnosed levers if pursued: trim Ch.9's narrated
      thesis-statement following the dramatized Bleed sequence (Theme);
      give Bram a scene that costs Wren something real, addressing the
      "never costs her anything directly" note carried since iteration
      2 (Characters); complicate one of the three carried-over "too
      easy" pacing beats (Ch.6 mentor gift, Ch.16 clean rescue, Ch.18
      fast capitulation) (Pacing). Not yet executed; would require a
      further revision-and-rescore cycle to verify.
  phase_6_editorial_package:
    status: "complete (provisional, updated for iteration 4)"
    outputs:
      - "artifacts/10-editorial-package.md"
    note: >
      Updated to reflect the iteration 4 audit/score state: zero open
      required-fix items, ~94,800 words (no longer a length-driven
      risk), Floor 8.6 (clears gate), Weighted Average 8.82 (0.18 short
      of the 9.0 gate). Still labeled PROVISIONAL / PRE-APPROVAL at the
      top of the file, and its query strategy section still says "do
      not query yet," since the manuscript has not yet cleared the
      approval gate. Should not be sent externally (agents/editors/
      readers) until the Weighted Average clears 9.0 on a future
      re-score.

