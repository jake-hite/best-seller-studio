project:
  title: "The Open Hand"
  slug: "the-open-hand"
  source_bible: "jake-hite/novel-bible"
  pipeline: "book-genesis-codex"
  language: "en"
  genre: "secondary-world fantasy"
  target_length_words: 100000
  target_chapter_count: 20
  narrative_mode: "third-limited, single POV (Wren Wickern), past tense"

pipeline_status:
  phase_0_intake:
    status: "complete"
    outputs:
      - "ASSUMPTIONS.md"
      - "artifacts/00-brief.md"
      - "artifacts/01-market-map.md"
      - "artifacts/02-story-engine.md"
  phase_1_foundation:
    status: "complete"
    outputs:
      - "artifacts/03-characters.md"
      - "artifacts/04-theme.md"
      - "artifacts/06-emotional-curve.md"
  phase_2_architecture:
    status: "complete"
    outputs:
      - "artifacts/05-outline.md"
      - "artifacts/07-opening-strategy.md"
  phase_3_drafting:
    status: "in_progress"
    outputs:
      - "manuscript/chapters"
    note: >
      Full 20-chapter outline exists in artifacts/05-outline.md. Chapters
      1-9 are drafted prose (Movements I and II complete, through Pinch 1).
      Chapters 10-20 are outlined but NOT yet drafted. This is tracked
      progress, not an oversight.
  phase_4_adversarial_audit:
    status: "not_started"
    note: "Cannot run honestly until full manuscript exists. Skipped, not failed."
  phase_5_final_score:
    status: "not_started"
    note: "Blocked on Phase 4 per pipeline rule: never score before audit."
  phase_6_editorial_package:
    status: "not_started"

