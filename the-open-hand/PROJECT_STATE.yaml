decisions_log:
  - "Beloved (Mari) lives; cost is paid in identity/permanent vulnerability, not death. See ASSUMPTIONS.md."
  - "Protagonist is a Material-opener, not a Person-opener, per character-types.md's least-burdened/gender-mixed specialization."
  - "Antagonist (Vesper Reed) built on the Broken Healer route per character-types.md and antagonist.md's sympathetic-villain mandate."
  - "Title selected: The Open Hand."
