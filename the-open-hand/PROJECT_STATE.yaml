project:
  title: "The Open Hand"
  slug: "the-open-hand"
  source_bible: "jake-hite/novel-bible"
  pipeline: "book-genesis-codex"
  language: "en"
  genre: "secondary-world fantasy"
  target_length_words: 100000
  target_chapter_count: 20
  narrative_mode: "third-limited, single POV (Wren Wickern), past tense"

pipeline_status:
  phase_0_intake:
    status: "complete"
    outputs:
      - "ASSUMPTIONS.md"
      - "artifacts/00-brief.md"
      - "artifacts/01-market-map.md"
      - "artifacts/02-story-engine.md"
  phase_1_foundation:
    status: "complete"
    outputs:
      - "artifacts/03-characters.md"
      - "artifacts/04-theme.md"
      - "artifacts/06-emotional-curve.md"
  phase_2_architecture:
    status: "complete"
    outputs:
      - "artifacts/05-outline.md"
      - "artifacts/07-opening-strategy.md"
  phase_3_drafting:
    status: "complete"
    outputs:
      - "manuscript/chapters"
    note: >
      All 20 chapters are drafted prose; the full arc (Hook through
      Resolution/denouement) is complete end-to-end. Total manuscript is
      approximately 34,400 words against the original 100,000-word
      target -- this is a complete but tightly-paced draft (closer to
      novella length than the target's full novel length), since each
      chapter was drafted at scene-economy length rather than expanded
      to target word count. Flagged honestly here rather than silently
      claiming target length was met; expansion (deepening scene work,
      adding texture/subplot beats within existing chapters, or
      inserting additional chapters) remains an open option before
      Phase 6 packaging if the full target length is wanted. Phase 4
      audit can proceed on the current complete draft regardless, per
      the pipeline rule that audit requires a full manuscript, not a
      full-length one.
  phase_4_adversarial_audit:
    status: "complete (re-audited, iteration 6)"
    outputs:
      - "artifacts/08-adversarial-audit.md"
    verdict: "PASS (zero open required-fix items, held since iteration 4)"
    note: >
      Three further close-the-gap fix rounds run against the
      iteration-4 PASS baseline, each independently re-audited:
      iteration 5 added a Theme trim (Ch.9 narrated thesis-statement
      following the Bleed sequence), a Pacing fix (Ch.18's capitulation
      slowed with a genuine resistance beat grounded in Vesper's
      backstory), and a first Characters fix (Ch.20, naming a cost to
      Bram) -- the last judged only partially resolved, since the cost
      landed on Bram rather than on Wren. Iteration 6 then added a
      second, deeper Characters fix: a new scene appended to the end of
      Ch.14 in which helping Bram with a failing dye commission costs
      Wren a practice session and sleep before a high-stakes rehearsal,
      with the cost confirmed paid forward into Ch.15's opening. This
      fully resolved the "Bram never costs Wren anything directly"
      finding carried since iteration 2 across five iterations -- the
      longest-open finding in the project's audit history. All 7
      mandatory passes hold clean at iteration 6; all four
      iteration-3-era structural-repetition patterns and the Voice
      exclusivity rule remain confirmed unregressed. Required
      follow-up fixes remain at zero across iterations 4, 5, and 6.
  phase_5_final_score:
    status: "complete (re-scored, iteration 6)"
    outputs:
      - "artifacts/09-genesis-score-codex.md"
    floor_score: 8.8
    weighted_average: 8.93
    gate_verdict: "NOT APPROVED (real score; Weighted Average short of 9.0 by 0.07)"
    note: >
      Real, non-provisional score (Phase 4 re-audit does not conclude
      MAJOR REWRITE). Per the user's "let's close the gap" direction,
      three iterations of targeted fixes ran against the iteration-4
      baseline (Floor 8.6, WA 8.82, gap 0.18). Iteration 5 (Floor 8.7,
      WA 8.88, gap 0.12): Theme 8.6->8.9 (Ch.9 fix, fully resolved),
      Pacing 8.6->8.8 (Ch.18 fix, fully resolved), Characters 8.6->8.7
      (Ch.20 fix, only partially resolved -- cost landed on Bram, not
      Wren). Iteration 6 (Floor 8.8, WA 8.93, gap 0.07): Characters
      8.7->9.0 (+0.3, the deeper Ch.14 fix, fully resolved -- the
      project's longest-carried finding, closed for the first time),
      Market 8.7->8.8 (+0.1, secondary comp-fit effect of the same
      fix). Unchanged across all three iterations: Originality 9.1,
      Prose 8.8, Emotion 9.0, Coherence 9.1, Voice 8.9, Opening 8.8.
      All ten dimensions clear 8.0, most by a full point or more; Floor
      Score clears the 8.5 gate with its widest-ever margin. Only the
      Weighted Average gate condition still fails, by the smallest
      margin yet recorded (0.07, down from 0.18 at iteration 4). Every
      specific, named craft defect this audit has ever raised against
      this manuscript has now been resolved. What remains open is
      confined to the audit's lowest-priority tier -- two long-declined
      Pacing softness notes (Ch.6's mentor gift, Ch.16's clean rescue)
      that the audit has repeatedly declined to call defects since
      iteration 2/3 -- and the iteration-6 audit explicitly cautions
      that the manuscript may be approaching this audit method's
      natural ceiling, with further yield likely small and uncertain.
      Not yet pursued further pending a decision on whether the
      marginal 0.07 is worth chasing.
  phase_6_editorial_package:
    status: "complete (provisional, updated for iteration 6)"
    outputs:
      - "artifacts/10-editorial-package.md"
    note: >
      Updated to reflect the iteration 6 audit/score state: zero open
      required-fix items, ~95,900 words (verified by direct word
      count), Floor 8.8 (clears gate with the widest margin yet),
      Weighted Average 8.93 (0.07 short of the 9.0 gate, the smallest
      gap recorded across six iterations). Still labeled PROVISIONAL /
      PRE-APPROVAL at the top of the file, and its query strategy
      section still says "do not query yet," since the manuscript has
      not yet cleared the approval gate. Should not be sent externally
      (agents/editors/readers) until the Weighted Average clears 9.0 on
      a future re-score.

